name: CI

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.24.2"
          cache: true
      - name: Vet
        run: go vet ./...
      - name: Run tests
        run: go test ./...
      - name: Verify npm package contents
        run: |
          cd npm
          npm pack --dry-run 2>&1 | grep 'bin/vcf-toolkit.js'
